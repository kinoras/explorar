[project]
name = "backend-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]==0.143.3",
    "google-genai>=2.31.0",
    "google-maps-routing>=0.11.2",
    "jsonschema>=4.26.0",
    "openai>=3.33.0",
    "polyline>=2.0.4",
    "pydantic-settings>=2.16.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
app = "app.main:app"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27.0",
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.1",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
